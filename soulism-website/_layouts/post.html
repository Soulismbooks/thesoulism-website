<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- 🟢 100% AUTOMATIC SEO & META TAGS -->
<title>{{ page.title }} | Soulism Blog</title>
<meta name="description" content="{{ page.excerpt | strip_html | truncatewords: 30 }}">

<!-- 🟢 USA Audience & Social Preview Tags -->
<meta property="og:title" content="{{ page.title }}">
<meta property="og:description" content="{{ page.excerpt | strip_html | truncatewords: 30 }}">
<meta property="og:type" content="article">
<meta property="og:locale" content="en_US">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
<meta property="og:image" content="{{ site.url }}{{ page.image }}">
<meta property="og:site_name" content="Soulism">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.title }}">
<meta name="twitter:description" content="{{ page.excerpt | strip_html | truncatewords: 30 }}">
<meta name="twitter:image" content="{{ site.url }}{{ page.image }}">

<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="stylesheet" href="/style.css"> 
<style>
  .post-body { max-width:700px; margin:0 auto; font-size:1.1rem; line-height:1.8; color:#333; }
  .post-body h2 { margin-top:1.8em; margin-bottom:0.8em; color:#1f2937; }
  .post-body img { width:100%; border-radius:12px; margin:25px 0; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
  .post-body blockquote { border-left:4px solid #16a34a; margin:30px 0; padding:10px 0 10px 25px; font-style:italic; font-size:1.25rem; color:#4b5563; background:#f9fafb; }
  
  /* Share Buttons CSS */
  .share-section { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 60px; padding-top: 30px; border-top: 2px dashed #e5e7eb; }
  .share-section p { margin: 0; font-weight: 600; font-size: 1.1rem; width: 100%; margin-bottom: 5px; color:#111; }
  .share-btn { padding: 10px 18px; border-radius: 6px; color: white; font-size: 15px; font-weight: 500; border: none; cursor: pointer; transition: 0.2s ease; }
  .share-btn:hover { opacity: 0.85; }
  .btn-wa { background: #25D366; }
  .btn-fb { background: #1877F2; }
  .btn-tw { background: #1DA1F2; }
  .btn-copy { background: #64748b; }
</style>
</head>
<body>

<header class="site">
  <nav class="nav">
    <a href="/index.html" class="logo">
      <img src="/images/soulism-logo.png" alt="Soulism logo" style="height:40px; width:auto;">
    </a>
    <ul class="navlinks" id="navlinks">
      <li><a href="/index.html">Home</a></li>
      <li><a href="/about.html">About Soulism</a></li>
      <li><a href="/books.html">Books</a></li>
      <li><a href="/blog.html" class="active">Blog</a></li>
      <li><a href="/contact.html">Contact</a></li>
    </ul>
  </nav>
</header>

<section class="hero" style="padding-bottom:20px;">
  <div class="wrap post-body">
    <a href="/blog.html" style="font-size:0.95rem; color:#6b7280; text-decoration:none; font-weight:500;">← Back to Blog</a>
    <div style="margin-top:25px;">
      <!-- 🟢 मशीन डेट और टैग यहाँ खुद भरेगी -->
      <span class="eyebrow" style="color:#16a34a; font-weight:600;">
        {{ page.date | date: "%B %d, %Y" }} {% if page.tag %} · {{ page.tag }} {% endif %}
      </span>
    </div>
    <!-- 🟢 मशीन ब्लॉग का टाइटल यहाँ खुद भरेगी -->
    <h1 id="post-title" style="max-width:700px; margin-top:10px; font-size: 2.8rem; line-height: 1.2;">{{ page.title }}</h1>
  </div>
</section>

<section style="padding-top:0;">
  <div class="wrap post-body">
    
    <!-- 🟢 मशीन आपका पूरा आर्टिकल (Markdown) इस जगह पर डाल देगी -->
    {{ content }}
    
    <!-- Share Buttons -->
    <div class="share-section">
        <p>Share this reflection:</p>
        <button onclick="window.open('https://api.whatsapp.com/send?text=' + encodeURIComponent(document.title + ' - Read here: ' + window.location.href), '_blank')" class="share-btn btn-wa">WhatsApp</button>
        <button onclick="window.open('https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(window.location.href), '_blank')" class="share-btn btn-fb">Facebook</button>
        <button onclick="window.open('https://twitter.com/intent/tweet?url=' + encodeURIComponent(window.location.href) + '&text=' + encodeURIComponent('Read this reflection: ' + document.title), '_blank')" class="share-btn btn-tw">Twitter</button>
        <button onclick="navigator.clipboard.writeText(window.location.href); this.innerText='Copied!'; this.style.background='#16a34a'; setTimeout(()=> {this.innerText='Copy Link'; this.style.background='#64748b';}, 2000);" class="share-btn btn-copy">Copy Link</button>
    </div>
  </div>
</section>

<footer class="site" style="margin-top: 80px; padding: 40px 0; border-top: 1px solid #e5e7eb; text-align: center;">
  <div class="wrap">
      <p style="color:#6b7280; font-size: 0.95rem; margin:0;">© 2026 Soulism. All rights reserved. | Founded by Shashank</p>
  </div>
</footer>

</body>
</html>

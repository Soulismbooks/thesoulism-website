## SOULISM BLOG ADMIN CONFIG
## ------------------------------------------------------------
## Before this works, replace the THREE placeholders below:
##   1. YOUR_GITHUB_USERNAME/YOUR_REPO_NAME   -> your actual GitHub repo
##   2. YOUR-WORKER-SUBDOMAIN                 -> your Cloudflare Worker URL (see oauth-worker.js instructions)
## ------------------------------------------------------------
backend:
  name: github
  repo: Soulismbooks/thesoulism-website
  branch: main
  base_url: https://soulism-oauth.soulism.workers.dev
  auth_endpoint: auth
media_folder: "soulism-website/images/blog"
public_folder: "/images/blog"
collections:
  - name: "posts"
    label: "Blog Posts"
    # 🟢 बदलाव यहाँ हुआ है: posts को _posts कर दिया गया है
    folder: "soulism-website/_posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - label: "Tag"
        name: "tag"
        widget: "select"
        options: ["Belief", "Fear", "Meaning", "Money", "Relationships", "Purpose"]
      - { label: "Excerpt (shown on the blog list)", name: "excerpt", widget: "text" }
      - { label: "Post Image (optional)", name: "image", widget: "image", required: false }
      - label: "Body"
        name: "body"
        widget: "markdown"
        modes: ["rich_text", "raw"]
        buttons:
          - bold
          - italic
          - code
          - link
          - heading-one
          - heading-two
          - heading-three
          - heading-four
          - quote
          - code-block
          - bulleted-list
          - numbered-list
        editor_components:
          - image
          - code-block

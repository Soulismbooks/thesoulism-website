<path d="M0 555 Q180 470 380 555 T780 530 T1200 520 V800 H0Z" fill="#314d3c" opacity=".7"/>
<path d="M580 800 C630 700 500 660 600 585 S825 500 900 410" fill="none" stroke="#d7c39b" stroke-width="58" opacity=".85"/>
<path d="M580 800 C630 700 500 660 600 585 S825 500 900 410" fill="none" stroke="#f4e5c5" stroke-width="3" stroke-dasharray="14 15" opacity=".9"/>
<!-- sprout -->
<path d="M155 585 Q155 530 180 490" stroke="#b7d78d" stroke-width="10" fill="none" stroke-linecap="round"/>
<path d="M174 515 Q110 505 116 455 Q165 460 174 515Z" fill="#a7c977"/>
<path d="M174 505 Q205 435 255 455 Q242 500 174 505Z" fill="#d1e09c"/>
<path d="M90 590 Q170 570 270 590" stroke="#c5a77b" stroke-width="9" fill="none" stroke-linecap="round"/>
<!-- tree -->
<path d="M1030 490 Q1005 380 1040 265 L1080 265 Q1060 390 1100 490Z" fill="#443a2d"/>
<g fill="#654e35"><circle cx="1035" cy="240" r="70"/><circle cx="1090" cy="210" r="75"/><circle cx="975" cy="200" r="55"/><circle cx="1050" cy="150" r="65"/></g>
<g fill="#a46f3d" opacity=".9"><circle cx="1000" cy="180" r="17"/><circle cx="1060" cy="120" r="15"/><circle cx="1115" cy="205" r="13"/><circle cx="1035" cy="250" r="12"/><circle cx="970" cy="220" r="12"/></g>
<rect x="65" y="48" width="1070" height="190" rx="26" fill="#101c1c" fill-opacity=".62" stroke="#e5c77b" stroke-opacity=".65" stroke-width="2"/>
<text x="600" y="115" fill="#f4d98d" font-family="Georgia,serif" font-size="31" letter-spacing="8" text-anchor="middle">THE SOULISM PERSPECTIVE</text>
<text x="600" y="174" fill="#fff8e6" font-family="Georgia,serif" font-size="47" font-weight="bold" text-anchor="middle">LIFE IS THE JOURNEY</text>
<text x="600" y="218" fill="#fff8e6" font-family="Georgia,serif" font-size="34" text-anchor="middle">BETWEEN TWO CERTAINTIES</text>

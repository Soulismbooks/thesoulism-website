<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">The Meaning of Life Is Found Between Birth and Death</title>
<desc id="desc">A life journey from sunrise and a sprouting seed through a winding path to a sunset, under the words Life is the journey between two certainties.</desc>
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#192a2d"/><stop offset=".6" stop-color="#667b69"/><stop offset="1" stop-color="#e8b56a"/></linearGradient>
 <linearGradient id="field" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#66815b"/><stop offset="1" stop-color="#253f37"/></linearGradient>
 <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0b2"/><stop offset="1" stop-color="#dba54c"/></linearGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
<rect width="1200" height="800" rx="28" fill="url(#sky)"/>
<circle cx="180" cy="230" r="115" fill="#f6d995" opacity=".28" filter="url(#soft)"/>
<circle cx="180" cy="230" r="68" fill="url(#sun)"/>
<circle cx="1010" cy="320" r="82" fill="url(#sun)" opacity=".95"/>

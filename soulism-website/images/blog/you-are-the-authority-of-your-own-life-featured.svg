<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">You Are the Authority of Your Own Life</title>
<desc id="desc">A lone figure stands on a mountain ridge before a golden sunrise, symbolising conscious awareness and the freedom to choose one's path.</desc>
<defs>
  <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#102b35"/><stop offset=".48" stop-color="#315e63"/><stop offset="1" stop-color="#eaa64f"/></linearGradient>
  <radialGradient id="sun"><stop stop-color="#fff9d8"/><stop offset=".28" stop-color="#ffe7a0"/><stop offset="1" stop-color="#f8b65d" stop-opacity="0"/></radialGradient>
  <linearGradient id="gold" x2="1" y2="1"><stop stop-color="#f8d98c"/><stop offset="1" stop-color="#c58a38"/></linearGradient>
  <linearGradient id="ridge" x2="0" y2="1"><stop stop-color="#284c43"/><stop offset="1" stop-color="#10221f"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="24"/></filter>
  <filter id="shadow"><feGaussianBlur stdDeviation="8"/></filter>
  <linearGradient id="veil" x2="1"><stop stop-color="#081c20" stop-opacity=".45"/><stop offset=".63" stop-color="#081c20" stop-opacity=".04"/><stop offset="1" stop-color="#081c20" stop-opacity=".15"/></linearGradient>
</defs>

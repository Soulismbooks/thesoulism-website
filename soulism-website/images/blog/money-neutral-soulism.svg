<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Money Is Neither Good Nor Evil</title><desc id="desc">A golden balance scale weighs coins on one side and a thriving green seedling on the other, between a shadowy city and a peaceful sunrise landscape. The Soulism perspective on money and inner prosperity.</desc>
